# PostgreSQL datasource configuration for development environment
spring.datasource.url=jdbc:postgresql://localhost:5432/dscommerce
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgresqladmin

# JPA / Hibernate settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# OAuth2 client credentials (dev profile only — do not use in production)
security.client-id=dscommerce
security.client-secret=dscommerce-secret-dev

cors.origins=http://localhost:3000,http://localhost:5173
