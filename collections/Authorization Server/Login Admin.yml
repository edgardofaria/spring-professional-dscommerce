info:
  name: Login Admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/oauth2/token"
  body:
    type: form-urlencoded
    data:
      - name: username
        value: "{{admin-username}}"
      - name: password
        value: "{{admin-password}}"
      - name: grant_type
        value: password
  auth:
    type: basic
    username: "{{client-id}}"
    password: "{{client-secret}}"

runtime:
  scripts:
    - type: tests
      code: |-
        if (res.status == 200) {
          bru.setEnvVar('token', res.body.access_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
