info:
  name: New order (auth)
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/orders"
  body:
    type: json
    data: |-
      {
        "items": [
          {
            "productId": 1,
            "quantity": 2
          },
          {
            "productId": 3,
            "quantity": 1
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
