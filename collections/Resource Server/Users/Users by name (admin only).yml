info:
  name: Users by name (admin only)
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/users?name=Alex"
  params:
    - name: name
      value: Alex
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
